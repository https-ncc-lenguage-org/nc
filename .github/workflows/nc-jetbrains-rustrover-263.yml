name: nC JetBrains RustRover 2026.3.1

on:
  pull_request:
    paths:
      - 'tools/jetbrains/nc-language-plugin/**'
      - '.github/workflows/nc-jetbrains-rustrover-263.yml'
  push:
    branches:
      - feature/rustrover-2026-3-1-lsp-marketplace
    paths:
      - 'tools/jetbrains/nc-language-plugin/**'
      - '.github/workflows/nc-jetbrains-rustrover-263.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout only plugin sources
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/jetbrains/nc-language-plugin
          filter: blob:none
          persist-credentials: false

      - name: Python 3 for the LSP bridge
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run LSP protocol and contract tests
        working-directory: tools/jetbrains/nc-language-plugin
        run: python -m unittest discover -s tests -v

      - name: Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.2.1'

      - name: Compile and package plugin for RustRover 2026.3.1
        working-directory: tools/jetbrains/nc-language-plugin
        run: gradle --no-daemon --console=plain --stacktrace clean buildPlugin verifyPluginProjectConfiguration

      - name: Verify binary compatibility against RustRover
        working-directory: tools/jetbrains/nc-language-plugin
        run: gradle --no-daemon --console=plain --stacktrace verifyPlugin

      - name: Upload plugin ZIP (not published to Marketplace)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nC-Language-RustRover-2026.3.1
          path: tools/jetbrains/nc-language-plugin/build/distributions/*.zip
          if-no-files-found: error
          retention-days: 14
